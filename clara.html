<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#11191b"><title>AKTE 017 · Claras Sprachmemo</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#11191b;color:#f2eee3}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at top,#2b3638,transparent 70%),#11191b}main{width:100%;max-width:480px;border:1px solid #58605b;background:#192225;box-shadow:0 24px 70px #0006}header{padding:26px 26px 20px;border-bottom:1px solid #58605b}.eyebrow,.label,footer{font:11px/1.6 monospace;letter-spacing:1.5px;text-transform:uppercase}.eyebrow{color:#cfb481}h1{font-size:30px;line-height:1.15;margin:13px 0 8px}header p{margin:0;color:#b9c2bf;font-size:14px;line-height:1.6}.body{padding:26px}.tape{height:110px;border:1px solid #63706d;background:repeating-linear-gradient(0deg,#ffffff03 0 1px,transparent 1px 4px),#101719;display:flex;align-items:center;justify-content:center;gap:36px;margin:0 0 24px}.reel{width:62px;height:62px;border:9px double #86918b;border-radius:50%;background:radial-gradient(circle,#cfb481 0 5px,transparent 6px)}.playing .reel{animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}button{font:700 16px Arial,sans-serif;cursor:pointer;border:0;border-radius:2px;min-height:52px;padding:14px 18px;background:#d0b47e;color:#131b1c;width:100%}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #f2eee3;outline-offset:4px}.secondary{margin-top:12px;background:transparent;border:1px solid #697570;color:#e7e8e2;font-size:14px;min-height:44px}.times{display:flex;justify-content:space-between;font:12px monospace;color:#b9c2bf;margin:16px 0 6px}input{width:100%;accent-color:#d0b47e;min-height:30px;margin:0}#status{min-height:38px;font-size:13px;line-height:1.5;color:#b9c2bf;margin:14px 0}audio{width:100%}a{color:#dcc28e;font-size:13px;line-height:1.7}footer{padding:17px 26px;border-top:1px solid #58605b;color:#899792;font-size:10px;letter-spacing:1px}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){.playing .reel{animation:none}}
</style></head><body><main><header><div class="eyebrow">AKTE 017 / DIGITALER TONTRÄGER</div><h1>Claras Sprachmemo</h1><p>A05-T · Gesicherte Aufnahme</p></header><div class="body"><div class="tape" aria-hidden="true"><div class="reel"></div><div class="reel"></div></div><audio id="audio" controls preload="metadata" src="clara.mp3">Dein Browser unterstützt die Audiowiedergabe nicht.</audio><div id="controls" hidden><button id="play" type="button">▶ Aufnahme abspielen</button><div class="times"><span id="elapsed">0:00</span><span id="duration">–:––</span></div><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Position der Aufnahme"><button class="secondary" id="restart" type="button">↺ Von vorne hören</button></div><p id="status" role="status" aria-live="polite">Zum Anhören auf Abspielen tippen.</p><a href="clara.mp3" download>MP3 öffnen / herunterladen</a></div><footer>Privates Ermittlerspiel · Fiktive Aufnahme</footer></main>
<script>
const audio=document.getElementById('audio'),play=document.getElementById('play'),seek=document.getElementById('seek'),status=document.getElementById('status');
audio.removeAttribute('controls');document.getElementById('controls').hidden=false;
const stamp=s=>Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'–:––';
function update(){document.getElementById('elapsed').textContent=stamp(audio.currentTime);document.getElementById('duration').textContent=stamp(audio.duration);seek.value=audio.duration?audio.currentTime/audio.duration*100:0;}
async function start(){try{status.textContent='Aufnahme wird geladen …';await audio.play();}catch(e){status.textContent='Wiedergabe nicht möglich. Prüfe die Verbindung oder öffne die MP3 über den Link unten.';}}
play.addEventListener('click',()=>audio.paused?start():audio.pause());
document.getElementById('restart').addEventListener('click',()=>{audio.currentTime=0;start();});
seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration))audio.currentTime=audio.duration*Number(seek.value)/100;});
audio.addEventListener('play',()=>{play.textContent='Ⅱ Aufnahme pausieren';document.body.classList.add('playing');status.textContent='Aufnahme läuft.';});
audio.addEventListener('pause',()=>{play.textContent=audio.ended?'▶ Erneut abspielen':'▶ Aufnahme fortsetzen';document.body.classList.remove('playing');status.textContent=audio.ended?'Aufnahme beendet. Du kannst sie erneut anhören.':'Aufnahme pausiert.';});
audio.addEventListener('ended',()=>{play.textContent='▶ Erneut abspielen';status.textContent='Aufnahme beendet. Du kannst sie erneut anhören.';});
audio.addEventListener('error',()=>{status.textContent='Die Audiodatei konnte nicht geladen werden. Prüfe die Verbindung oder nutze den MP3-Link unten.';document.body.classList.remove('playing');});
audio.addEventListener('loadedmetadata',update);audio.addEventListener('timeupdate',update);
</script></body></html>
